<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="TokenScope">
  <!-- TokenScope mark: a scope ring sighted on a rising token/cost bar chart.
       This is the full-colour badge used as the browser tab icon (favicon), so
       it carries its own violet ground and stays legible on a light or dark
       tab strip. The monochrome silhouette in icon.svg is the same geometry
       with the ground removed, because the sidebar consumes that one as a CSS
       mask and a ground would paint a solid square. Keep the two in sync. -->
  <defs>
    <linearGradient id="ts-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#ts-bg)"/>
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
    <circle cx="16" cy="15" r="8.6"/>
  </g>
  <g fill="#fff">
    <!-- Three bars, ascending left to right; each corner stays inside the ring. -->
    <rect x="11.1" y="16.2" width="2.2" height="3.4" rx="1.1"/>
    <rect x="14.9" y="13.4" width="2.2" height="6.2" rx="1.1"/>
    <rect x="18.7" y="10.6" width="2.2" height="9.0" rx="1.1"/>
  </g>
</svg>
